<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Summary</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Romantic font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>
  body {
    font-family: 'Playfair Display', serif;
  }

  #list {
    max-width: 600px;
    margin: 30px auto 60px auto; /* space below list */
    line-height: 1.6;
    font-size: 18px;
  }

  #list li {
    margin-bottom: 10px;
  }

  .important-text {
    margin-top: 40px;
    text-align: center;
  }

  .important-text h1 {
    font-size: 26px;
    margin-bottom: 12px;
  }

  .important-text h2 {
    font-size: 20px;
    font-weight: 500;
    opacity: 0.85;
  }

  .restart-btn {
    display: block;
    margin: 40px auto 20px auto;
    padding: 14px 28px;
    border: none;
    border-radius: 30px;
    background: #ff4d6d;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  .bg-fade {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5); /* 40% fade */
    z-index: -1;
  }
</style>
</head>

<body class="entry-bg" style="background-image:url('assets/bg/summary.jpg')">
    <div class="bg-fade"></div>
<h1 style="text-align:center">Our Valentine Week 💌</h1>

<ul id="list"></ul>

<div class="important-text">
  <h1>More Important: Else You Will Lose All the Fun…</h1>
  <h2>Send me a screenshot of this ASAP 😌</h2>
</div>

<button class="restart-btn" onclick="location.href='index.html'">
  Not Happy With these Choices, I Know You better soo Start From Beginning Betuu
</button>

<script>
Object.keys(localStorage).forEach(k => {
  let li = document.createElement("li");
  li.textContent = k + " → " + localStorage[k];
  document.getElementById("list").appendChild(li);
});
</script>

</body>
</html>
