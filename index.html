<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Just One Question…</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<!-- Romantic font -->
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

<style>
  .intro-text {
    font-family: 'Pinyon Script', cursive;
    color: #faf6f9;
    font-size: 50px;
    line-height: 1.0;
    margin-bottom: 15px;
    font-weight: 1000;
  }
  .bg-fade {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4); /* 40% fade */
  z-index: -1;
}

  
</style>
</head>

<body class="center entry-bg" style="background-image:url('assets/bg/entry.jpg')">
    <div class="bg-fade"></div>
<div style="text-align:center;max-width:380px;position:relative;">

  <p class="intro-text">
    Hey you…<br></br>
    Do you really love me?
  </p>

  <button onclick="location.href='rose.html'">
    Of course I do 😏
  </button>
<br></br>
  <button id="prove">
    Let me prove it for you Bubba 😉
  </button>

</div>

<!-- Success overlay -->
<div id="overlay" class="overlay hidden">
  <h1>Yesss 😌</h1>
  <p>That effort was cute…</p>
</div>

<script>
const btn = document.getElementById("prove");
const overlay = document.getElementById("overlay");

let attempts = 0;
let settled = false;
const REQUIRED_MOVES = 10;

// Safe mischievous movement
function tease() {
  if (settled) return;

  attempts++;

  btn.style.position = "fixed";

  const btnWidth = btn.offsetWidth;
  const btnHeight = btn.offsetHeight;

  const maxX = window.innerWidth - btnWidth - 20;
  const maxY = window.innerHeight - btnHeight - 20;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  btn.style.left = x + "px";
  btn.style.top = y + "px";

  // Settle ONLY after required moves
  if (attempts >= REQUIRED_MOVES) {
    settled = true;
    btn.style.transition = "0.4s ease";
    btn.style.left = "50%";
    btn.style.top = "70%";
    btn.style.transform = "translateX(-50%)";
  }
}

// Teasing interactions
btn.addEventListener("mouseenter", tease);
btn.addEventListener("mousemove", tease);
btn.addEventListener("touchstart", tease);

// Click logic
btn.addEventListener("click", () => {
  if (!settled) {
    tease(); // clicking before settle just teases more
    return;
  }

  // Once settled, click ALWAYS succeeds
  overlay.classList.remove("hidden");

  setTimeout(() => {
    window.location.href = "rose.html";
  }, 1500);
});
</script>

</body>
</html>
